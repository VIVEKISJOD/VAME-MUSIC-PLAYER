name: Build VAME APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upload a zip (any name, e.g. AmeosMusic_step16.zip) to the repo and it is
      # unpacked over the project, then deleted. Old zips are cleaned out too.
      - name: Apply uploaded zip (if any)
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Applying $ZIP"
            unzip -o -q "$ZIP" -x '.github/*'
            rm -f ./*.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply $ZIP and clean old zips" || true
            git push || true
          fi

      - name: Check project exists
        run: test -f app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAME-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release (only when you push a tag like v0.9.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
