name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip newest AmeosMusic zip
        run: |
          set -e
          ZIP=$(ls AmeosMusic_step*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          mkdir src
          unzip -q "$ZIP" -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: src
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK with throwaway key
        working-directory: src
        run: |
          set -e
          SDK=$ANDROID_HOME
          BT=$(ls $SDK/build-tools | sort -V | tail -1)
          UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          keytool -genkeypair -keystore ci.jks -alias ameos -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass ameos123 -keypass ameos123 -dname "CN=Ameos"
          $SDK/build-tools/$BT/zipalign -f -p 4 "$UNSIGNED" aligned.apk
          $SDK/build-tools/$BT/apksigner sign --ks ci.jks --ks-pass pass:ameos123 \
            --key-pass pass:ameos123 --out AmeosMusic.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AmeosMusic-apk
          path: src/AmeosMusic.apk
