name: Build VAME APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upload a zip (any name, e.g. AmeosMusic_step17.zip) to the repo and it is
      # unpacked over the project, then deleted. Old zips are cleaned out too.
      - name: Apply uploaded zip (if any)
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Applying $ZIP"
            unzip -o -q "$ZIP" -x '.github/*'
            rm -f ./*.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply $ZIP and clean old zips" || true
            git push || true
          fi

      - name: Check project exists
        run: test -f app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The same signing key every time = the app can update itself on users' phones.
      # The key lives in GitHub secrets KEYSTORE_BASE64 and KEY_PASSWORD.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vame.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/vame.jks" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=vame" >> "$GITHUB_ENV"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "No signing key found - building with the debug key (cannot update installed apps)"
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "VAME-$VER.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAME-apk
          path: VAME-*.apk

      # Users' apps check this release and offer the update.
      - name: Publish update for users
        if: env.HAS_KEY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk '/^## /{n++} n==1' CHANGELOG.md 2>/dev/null | tail -n +2 || true)
          if [ -z "$NOTES" ]; then NOTES="VAME $VER"; fi
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "VAME-$VER.apk" --clobber
          else
            gh release create "v$VER" "VAME-$VER.apk" --title "VAME $VER" --notes "$NOTES" --target main
          fi
