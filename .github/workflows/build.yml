name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o project.zip -d ameos

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APK
        working-directory: ameos
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        working-directory: ameos
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/$(ls /usr/local/lib/android/sdk/build-tools | sort -V | tail -n 1)
          keytool -genkeypair -keystore ci.jks -storepass android123 -keypass android123 -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ameos"
          $BT/zipalign -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ci.jks --ks-pass pass:android123 --key-pass pass:android123 --out AmeOS-Music.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ameos/AmeOS-Music.apka
